<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moonlight｜Handwriting</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Dancing+Script:wght@400;700&display=swap" rel="stylesheet">

</head>
<body>
    <header>
        <h1>Moonlight｜Handwriting</h1>
    </header>
    <main>
        <!-- About 區塊 -->
        <section class="about">
            <!-- 文字區域 -->
            <div class="about-content">
                <h2>Moonlight｜handwriting</h2>
                <p>Since 2024.11.11</p>
                <p>-</p>
                <p>｜手寫｜筆記｜生活｜心理｜故事｜</p>
                <p>-</p>
                <ul>
                    <li>▫️INFJ</li>
                    <li>▫️幼教背景</li>
                    <li>▫️澳洲留學</li>
                    <li>▫️喜歡手寫、筆記、自我對話</li>
                    <li>▫️做個溫暖、有愛但堅定的人</li>
                </ul>
                <p>-</p>
                <p>Moonlight</p>
                <p>溫暖的月光</p>
                <p>期待能夠溫暖自己也照亮他人</p>
                <!-- 社群按鈕 -->
                <div class="social-buttons">
                    <a href="https://www.instagram.com/moonlight_handwriting" target="_blank" class="btn ig-btn">Instagram</a>
                    <a href="https://store.line.me/emojishop/product/67611db8feefbb031e0150b8/zh-Hant?lang=en&utm_source=gnsh_sticonDetail" target="_blank" class="btn line-btn">LINE</a>
                </div>
            </div>

            <!-- 圖片區域 -->
            <div class="about-images">
                <img src="images/Sqaure.png" alt="Moonlight Logo">
                <img src="images/Merry Chrismas front_page.png" alt="Merry Christmas Card">
                <img src="images/Word1.png" alt="Word1">
                <img src="images/Word1_page.png" alt="Word1_page">
            </div>
            <p></p>
                <!-- 將聊天模組移到外部 -->
                <section class="chat-module">
                    <h3>Chat with Moonlight</h3>
                    <div id="chat-container">
                        <div id="messages"></div>
                        <div id="input-container">
                            <input type="text" id="user-input" placeholder="Type a message...">
                            <button id="send-button">Send</button>
                        </div>
                    </div>
                </section>
        </section>

    </main>
    <script src="script.js"></script>
</body>
</html>
